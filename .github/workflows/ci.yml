name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 工作流不需要 git push：checkout 后不保留 GITHUB_TOKEN，npm 依赖的安装脚本和测试代码就拿不到它
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 本地 Worker 只需要 SESSION_SECRET；支付、视频、审核都走 mock
      - name: Create .dev.vars
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .dev.vars
      - run: npm run seed:local
      - run: npm run test:e2e
      # 私有仓库的报告占账号的 Actions 存储（Free 每月 0.5 GB）：只在失败时上传，只传 HTML 报告
      # （CI 下只含失败用例的 trace 和截图，见 playwright.config.ts），短期保留
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-report
          path: .tmp/video-template-e2e/report/
          retention-days: 3
